<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upload Files</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e4e4e7;
    --text-muted: #a1a1aa;
    --accent: #4ade80;
    --accent-hover: #22c55e;
    --error: #f87171;
    --warning: #fbbf24;
    --border: #27272a;
    --progress-bg: #27272a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-text-size-adjust: 100%;
  }
  .container {
    width: 100%;
    max-width: 720px;
    padding: 24px 16px;
  }
  .header {
    text-align: center;
    margin-bottom: 24px;
  }
  .header h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 4px; }
  .header .job-name { color: var(--accent); font-size: 1.1rem; font-weight: 500; }
  .header .job-vehicle { color: var(--text-muted); font-size: 0.95rem; margin-top: 4px; }

  .status-msg {
    text-align: center;
    padding: 48px 16px;
    font-size: 1.1rem;
  }
  .status-msg.error { color: var(--error); }
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .banner {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    font-size: 0.9rem;
    display: none;
  }
  .banner.visible { display: flex; align-items: center; gap: 10px; }
  .banner .icon { font-size: 1.2rem; flex-shrink: 0; }
  .banner .info { flex: 1; }
  .banner .info .title { color: var(--warning); font-weight: 600; }
  .banner .info .detail { color: var(--text-muted); margin-top: 2px; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(74, 222, 128, 0.05);
  }
  .drop-zone .dz-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .drop-zone .label { font-size: 1rem; color: var(--text); margin-bottom: 4px; }
  .drop-zone .sublabel { font-size: 0.85rem; color: var(--text-muted); }
  .drop-zone input[type="file"] { display: none; }
  .alt-pick-btn { display:block; width:100%; margin-top:10px; background:none; border:none; color:var(--text-muted); font-size:0.85rem; text-decoration:underline; cursor:pointer; }
  .file-card .file-status.checking { color: var(--text-muted); }

  .file-list { margin-top: 16px; }
  .file-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .file-card .file-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .file-card .file-name {
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 8px;
  }
  .file-card .file-size { font-size: 0.8rem; color: var(--text-muted); flex-shrink: 0; }
  .file-card .file-status { font-size: 0.8rem; margin-top: 4px; }
  .file-card .file-status.uploading { color: var(--accent); }
  .file-card .file-status.complete { color: var(--accent); }
  .file-card .file-status.error { color: var(--error); }
  .file-card .file-status.queued { color: var(--text-muted); }
  .file-card .file-status.paused { color: var(--warning); }
  .file-card .file-status.stalled { color: var(--warning); }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--progress-bg);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-bar .fill.error { background: var(--error); }

  .overall-progress {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    display: none;
  }
  .overall-progress.visible { display: block; }
  .overall-progress .stats {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .overall-progress .eta { color: var(--warning); font-weight: 500; }

  .finish-section {
    text-align: center;
    margin-top: 20px;
    display: none;
  }
  .finish-section.visible { display: block; }
  .finish-btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 16px 36px;
    font-size: 1.05rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    min-height: 52px;
  }
  .finish-btn:hover { background: var(--accent-hover); }
  .finish-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .finish-status { margin-top: 12px; font-size: 0.9rem; color: var(--text-muted); }

  .done-section {
    text-align: center;
    padding: 48px 16px;
    display: none;
  }
  .done-section.visible { display: block; }
  .done-section .checkmark { font-size: 3rem; margin-bottom: 16px; }
  .done-section h2 { font-size: 1.3rem; margin-bottom: 8px; color: var(--accent); }
  .done-section p { color: var(--text-muted); }

  .retry-btn {
    background: none;
    border: 1px solid var(--error);
    color: var(--error);
    padding: 4px 12px;
    border-radius: 4px;
    font-size: 0.8rem;
    cursor: pointer;
    margin-left: 8px;
  }
  .retry-btn:hover { background: rgba(248, 113, 113, 0.1); }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Upload Files</h1>
    <div class="job-name" id="job-name"></div>
    <div class="job-vehicle" id="job-vehicle"></div>
  </div>

  <div class="status-msg" id="loading-state">
    <span class="spinner"></span> Verifying upload link...
  </div>

  <div class="status-msg error" id="error-state" style="display:none"></div>

  <div id="upload-section" style="display:none">
    <div class="banner" id="wake-banner">
      <span class="icon">&#9889;</span>
      <div class="info">
        <div class="title">Keep this page open</div>
        <div class="detail" id="wake-detail">Screen will stay on while uploading</div>
      </div>
    </div>

    <div class="banner" id="resume-banner">
      <span class="icon">&#8635;</span>
      <div class="info">
        <div class="title">Previous upload found</div>
        <div class="detail">Resuming from where it left off</div>
      </div>
    </div>

    <div class="drop-zone" id="drop-zone">
      <div class="dz-icon">&#128206;</div>
      <div class="label">Tap to select photos &amp; videos</div>
      <div class="sublabel">or drag and drop</div>
      <input type="file" id="file-input" accept="image/*,video/*" multiple>
      <input type="file" id="file-input-any" multiple>
    </div>
    <button type="button" class="alt-pick-btn" id="any-file-btn">Send a different file type (documents, zip)</button>

    <div class="file-list" id="file-list"></div>

    <div class="overall-progress" id="overall-progress">
      <div class="stats">
        <span id="progress-text">0 of 0 files</span>
        <span class="eta" id="eta-text"></span>
      </div>
      <div class="progress-bar"><div class="fill" id="overall-fill"></div></div>
    </div>

    <div class="finish-section" id="finish-section">
      <button class="finish-btn" id="finish-btn">Finish &amp; Save to Tracker</button>
      <div class="finish-status" id="finish-status"></div>
    </div>
  </div>

  <div class="done-section" id="done-section">
    <div class="checkmark">&#10003;</div>
    <h2>Upload Complete</h2>
    <p>Files saved to tracker. You can close this page.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.2.3/dist/tus.min.js"></script>
<script>
(function() {
  'use strict';

  var token = new URLSearchParams(location.search).get('t');
  var ua = navigator.userAgent;
  // In-app webviews (Slack, Facebook, Instagram, etc.) freeze background tabs hard and
  // behave like constrained mobile clients even on desktop — treat them as mobile.
  var isInAppBrowser = /Slack|FBAN|FBAV|Instagram|Line\/|Twitter|MicroMessenger|; wv\)/i.test(ua);
  var isMobile = /iPhone|iPad|iPod|Android/i.test(ua) || isInAppBrowser || window.innerWidth < 768;
  var CHUNK_SIZE = isMobile ? 2 * 1024 * 1024 : 5 * 1024 * 1024;
  var MAX_FILES = 1000;
  var BASE_CONCURRENT = isMobile ? 1 : 3;
  var RETRY_DELAYS = [0, 1000, 3000, 5000, 10000, 15000, 30000];

  var files = [];
  var completedUploadIds = [];
  var errorCount = 0;

  // Slots in use = files actively uploading (or briefly stalled between retries).
  // Derived from status, never hand-maintained, so pause/stall/retry cannot desync it.
  function countActive() {
    var n = 0;
    for (var i = 0; i < files.length; i++) {
      if (files[i].status === 'uploading' || files[i].status === 'stalled') n++;
    }
    return n;
  }
  // Back off to serial uploads once we've seen failures (flaky shop Wi-Fi protection).
  function getMaxConcurrent() {
    return errorCount >= 2 ? 1 : BASE_CONCURRENT;
  }
  var wakeLock = null;
  var totalBytes = 0;
  var lastSpeedTime = 0;
  var lastSpeedBytes = 0;
  var speedSamples = [];

  var loadingEl = document.getElementById('loading-state');
  var errorEl = document.getElementById('error-state');
  var uploadEl = document.getElementById('upload-section');
  var jobNameEl = document.getElementById('job-name');
  var jobVehicleEl = document.getElementById('job-vehicle');
  var dropZone = document.getElementById('drop-zone');
  var fileInput = document.getElementById('file-input');
  var fileListEl = document.getElementById('file-list');
  var overallEl = document.getElementById('overall-progress');
  var progressText = document.getElementById('progress-text');
  var etaText = document.getElementById('eta-text');
  var overallFill = document.getElementById('overall-fill');
  var finishSection = document.getElementById('finish-section');
  var finishBtn = document.getElementById('finish-btn');
  var finishStatus = document.getElementById('finish-status');
  var doneSection = document.getElementById('done-section');
  var wakeBanner = document.getElementById('wake-banner');
  var wakeDetail = document.getElementById('wake-detail');
  var resumeBanner = document.getElementById('resume-banner');

  function formatBytes(b) {
    if (b === 0) return '0 B';
    var k = 1024, s = ['B','KB','MB','GB'];
    var i = Math.floor(Math.log(b) / Math.log(k));
    return parseFloat((b / Math.pow(k, i)).toFixed(1)) + ' ' + s[i];
  }

  function formatTime(sec) {
    if (!sec || sec <= 0 || !isFinite(sec)) return '';
    if (sec < 60) return Math.round(sec) + 's';
    if (sec < 3600) return Math.round(sec / 60) + 'm ' + Math.round(sec % 60) + 's';
    return Math.floor(sec / 3600) + 'h ' + Math.round((sec % 3600) / 60) + 'm';
  }

  function showError(msg) {
    loadingEl.style.display = 'none';
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  // ─── Wake Lock ────────────────────────────────────────────────────
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function(wl) {
      wakeLock = wl;
      wakeLock.addEventListener('release', function() { wakeLock = null; });
      wakeBanner.classList.add('visible');
    }).catch(function() {});
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    wakeBanner.classList.remove('visible');
  }

  // ─── Visibility change — keep running (do NOT abort) ──────────────
  // Aborting an in-flight chunk when the tab is backgrounded (app switch,
  // notification, Slack -> browser flip) is what surfaces as
  // "failed to upload chunk at offset 0 ... [object ProgressEvent]". Let tus keep
  // uploading; if the OS truly suspends the tab, tus resumes via its own retry on wake.
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      if (countActive() > 0 && !wakeLock) requestWakeLock();
    }
  });

  // ─── Warn before leaving ──────────────────────────────────────────
  window.addEventListener('beforeunload', function(e) {
    if (countActive() > 0) { e.preventDefault(); e.returnValue = ''; }
  });

  // ─── Token verification ───────────────────────────────────────────
  if (!token) { showError('No upload token provided. Use the link from Slack.'); return; }

  fetch('/upload/verify?t=' + encodeURIComponent(token))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.ok) { showError(data.error || 'This upload link is invalid or expired.'); return; }
      loadingEl.style.display = 'none';
      uploadEl.style.display = 'block';
      jobNameEl.textContent = data.name;
      if (data.vehicle) jobVehicleEl.textContent = data.vehicle;
    })
    .catch(function() { showError('Could not verify upload link. Please try again.'); });

  // ─── File selection ───────────────────────────────────────────────
  dropZone.addEventListener('click', function() { fileInput.click(); });
  fileInput.addEventListener('change', function() {
    if (fileInput.files.length > 0) addFiles(fileInput.files);
    fileInput.value = '';
  });

  // Fallback picker: unfiltered input for documents/zip/etc. Android's photo picker
  // (triggered by accept="image/*,video/*") hides non-media files entirely.
  var fileInputAny = document.getElementById('file-input-any');
  fileInputAny.addEventListener('change', function() { if (fileInputAny.files.length > 0) addFiles(fileInputAny.files); fileInputAny.value = ''; });
  document.getElementById('any-file-btn').addEventListener('click', function() { fileInputAny.click(); });

  dropZone.addEventListener('dragenter', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
  dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
  });

  // ─── Readability probe ────────────────────────────────────────────
  // Google Photos / cloud-backed placeholders report a real size but never yield
  // bytes (crbug 41452449). tus would open the upload and hang forever at offset 0,
  // so read the first chunk up front and fail fast with actionable instructions.
  var PROBE_BYTES = 65536;
  var PROBE_TIMEOUT = 20000;
  var CLOUD_MSG = 'Could not read this file. If it is a Google Photos video, open Google Photos, tap the ⋮ menu, choose Download, wait for it to finish, then try again.';

  function readFirstBytes(file) {
    return new Promise(function(resolve, reject) {
      var blob = file.slice(0, Math.min(PROBE_BYTES, file.size));
      if (blob.arrayBuffer) { blob.arrayBuffer().then(resolve, reject); return; }
      var fr = new FileReader();
      fr.onload = function() { resolve(fr.result); };
      fr.onerror = function() { reject(fr.error || new Error('read failed')); };
      fr.readAsArrayBuffer(blob);
    });
  }

  function verifyReadable(entry) {
    var settled = false;
    function fail(msg) { if (settled) return; settled = true; entry.status = 'error'; entry.error = msg; errorCount++; updateFileCard(entry); processQueue(); }
    function pass() { if (settled) return; settled = true; entry.status = 'queued'; updateFileCard(entry); processQueue(); }
    if (entry.file.size === 0) { fail('File is empty (0 bytes) — cannot upload'); return; }
    var timer = setTimeout(function() { fail(CLOUD_MSG); }, PROBE_TIMEOUT);
    readFirstBytes(entry.file).then(function(buf) { clearTimeout(timer); if (!buf || buf.byteLength === 0) { fail(CLOUD_MSG); return; } pass(); }, function() { clearTimeout(timer); fail(CLOUD_MSG); });
  }

  function addFiles(fileList) {
    var newFiles = Array.from(fileList);
    if (files.length + newFiles.length > MAX_FILES) {
      alert('Maximum ' + MAX_FILES + ' files allowed.');
      return;
    }
    newFiles.forEach(function(file) {
      var entry = {
        id: Math.random().toString(36).substr(2, 9),
        file: file,
        status: 'checking',
        progress: 0,
        bytesUploaded: 0,
        tusUpload: null,
        tusId: null,
        error: null,
      };
      files.push(entry);
      totalBytes += file.size;
      createFileCard(entry);
      verifyReadable(entry);
    });
    overallEl.classList.add('visible');
    updateOverallProgress();
    requestWakeLock();
    processQueue();
  }

  // ─── File card UI (safe DOM construction) ─────────────────────────
  function createFileCard(entry) {
    var card = document.createElement('div');
    card.className = 'file-card';
    card.id = 'card-' + entry.id;

    var header = document.createElement('div');
    header.className = 'file-header';
    var nameSpan = document.createElement('span');
    nameSpan.className = 'file-name';
    nameSpan.textContent = entry.file.name;
    var sizeSpan = document.createElement('span');
    sizeSpan.className = 'file-size';
    sizeSpan.textContent = formatBytes(entry.file.size);
    header.appendChild(nameSpan);
    header.appendChild(sizeSpan);

    var progressBar = document.createElement('div');
    progressBar.className = 'progress-bar';
    var fill = document.createElement('div');
    fill.className = 'fill';
    fill.id = 'fill-' + entry.id;
    progressBar.appendChild(fill);

    var status = document.createElement('div');
    status.className = 'file-status queued';
    status.id = 'status-' + entry.id;
    status.textContent = 'Queued';

    card.appendChild(header);
    card.appendChild(progressBar);
    card.appendChild(status);
    fileListEl.appendChild(card);
  }

  function updateFileCard(entry) {
    var fill = document.getElementById('fill-' + entry.id);
    var status = document.getElementById('status-' + entry.id);
    if (!fill || !status) return;

    fill.style.width = Math.round(entry.progress * 100) + '%';
    fill.className = 'fill' + (entry.status === 'error' ? ' error' : '');

    // Clear previous status content
    while (status.firstChild) status.removeChild(status.firstChild);
    status.className = 'file-status ' + entry.status;

    if (entry.status === 'checking') {
      status.textContent = 'Checking file…';
    } else if (entry.status === 'queued') {
      status.textContent = 'Queued';
    } else if (entry.status === 'uploading') {
      status.textContent = 'Uploading... ' + Math.round(entry.progress * 100) + '%';
    } else if (entry.status === 'paused') {
      status.textContent = 'Paused \u2014 switch back to resume';
    } else if (entry.status === 'stalled') {
      status.textContent = 'Connection lost \u2014 reconnecting...';
    } else if (entry.status === 'complete') {
      status.textContent = 'Complete';
    } else if (entry.status === 'error') {
      status.textContent = entry.error || 'Failed';
      var retryBtn = document.createElement('button');
      retryBtn.className = 'retry-btn';
      retryBtn.textContent = 'Retry';
      retryBtn.addEventListener('click', function() { retryUpload(entry); });
      status.appendChild(retryBtn);
    }
  }

  // ─── Upload queue ─────────────────────────────────────────────────
  function processQueue() {
    while (countActive() < getMaxConcurrent()) {
      var next = null;
      for (var i = 0; i < files.length; i++) {
        if (files[i].status === 'queued') { next = files[i]; break; }
      }
      if (!next) break;
      startUpload(next);
    }
    checkAllComplete();
  }

  // ─── Stall detection ───────────────────────────────────────────────
  var STALL_TIMEOUT = 90000; // 90 seconds with no progress = stalled (raised from 30s — slow shop uploads of multi-GB files were tripping this mid-chunk)
  var MAX_STALL_RETRIES = 30; // raised from 5 — each retry resumes from the server's last offset, so they're cheap; large files on flaky connections were erroring out after 5 stalls

  function clearStallTimer(entry) {
    if (entry.stallTimer) { clearTimeout(entry.stallTimer); entry.stallTimer = null; }
  }

  function resetStallTimer(entry) {
    clearStallTimer(entry);
    entry.stallTimer = setTimeout(function() { handleStall(entry); }, STALL_TIMEOUT);
  }

  function handleStall(entry) {
    if (entry.status !== 'uploading') return;
    entry.stallCount = (entry.stallCount || 0) + 1;
    // Not a single byte through after 2 stalls => unreadable cloud placeholder, not
    // flaky Wi-Fi. 30 more resume attempts all restart from offset 0 and never finish.
    if (entry.bytesUploaded === 0 && entry.stallCount >= 2) { clearStallTimer(entry); entry.status = 'error'; entry.error = CLOUD_MSG; errorCount++; updateFileCard(entry); processQueue(); return; }
    if (entry.stallCount > MAX_STALL_RETRIES) {
      // Give up after too many stalls (status='error' frees the slot via countActive)
      clearStallTimer(entry);
      entry.status = 'error';
      entry.error = 'Upload stalled after ' + MAX_STALL_RETRIES + ' retries';
      errorCount++;
      updateFileCard(entry);
      processQueue();
      return;
    }
    // Show stalled status, then restart with a FRESH tus instance that resumes from the
    // server's last-known offset (HEAD). Restarting the aborted instance in-place is
    // fragile (tus's abort/error race can wedge it) and can itself emit offset-0 aborts.
    entry.status = 'stalled';
    updateFileCard(entry);
    setTimeout(function() {
      if (entry.status !== 'stalled') return; // user may have manually retried
      restartUpload(entry, false); // false = resume, don't discard server-side progress
    }, 2000);
  }

  // Tear down an entry's current tus instance and start a new one. Nulling tusUpload
  // first "supersedes" the old instance so any late/racing callback is ignored (see the
  // guards in startUpload). fresh=true discards resume state and uploads from zero.
  function restartUpload(entry, fresh) {
    var old = entry.tusUpload;
    entry.tusUpload = null;
    clearStallTimer(entry);
    if (old) { try { old.abort(); } catch (e) {} }
    entry.fresh = !!fresh;
    startUpload(entry);
  }

  // ─── Core TUS upload ──────────────────────────────────────────────
  function startUpload(entry) {
    entry.status = 'uploading';
    entry.stallCount = 0;
    updateFileCard(entry);

    var fresh = !!entry.fresh;
    entry.fresh = false;

    var upload = new tus.Upload(entry.file, {
      endpoint: '/tus/',
      chunkSize: CHUNK_SIZE,
      retryDelays: RETRY_DELAYS,
      removeFingerprintOnSuccess: true,
      metadata: {
        token: token,
        filename: entry.file.name,
        filetype: entry.file.type || 'application/octet-stream',
      },
      // Every callback ignores itself if this entry has moved on to a newer tus
      // instance (retry / stall-restart) or been cleared. Kills late/racing callbacks
      // from a superseded upload corrupting state.
      onError: function(err) {
        if (entry.tusUpload !== upload) return;
        clearStallTimer(entry);
        entry.status = 'error';
        entry.error = (entry.bytesUploaded === 0) ? CLOUD_MSG : (err.message || 'Upload failed');
        errorCount++;
        updateFileCard(entry);
        processQueue();
      },
      onProgress: function(bytesUploaded, bytesTotal) {
        if (entry.tusUpload !== upload) return;
        entry.stallCount = 0; // reset stall count on any progress
        resetStallTimer(entry);
        entry.bytesUploaded = bytesUploaded;
        entry.progress = bytesTotal > 0 ? bytesUploaded / bytesTotal : 0;
        updateFileCard(entry);
        updateOverallProgress();
      },
      onSuccess: function() {
        if (entry.tusUpload !== upload) return;
        clearStallTimer(entry);
        var uploadUrl = upload.url || '';
        var tusId = uploadUrl.split('/').pop();
        if (tusId) {
          entry.tusId = tusId;
          completedUploadIds.push(tusId);
        }
        entry.status = 'complete';
        entry.progress = 1;
        entry.bytesUploaded = entry.file.size;
        updateFileCard(entry);
        updateOverallProgress();
        processQueue();
      },
    });

    entry.tusUpload = upload;

    if (fresh) {
      // Explicit retry: start from zero, ignore any stale resume fingerprint.
      upload.start();
      resetStallTimer(entry); // Fix: only arm the stall clock once network I/O begins
    } else {
      upload.findPreviousUploads().then(function(prev) {
        if (entry.tusUpload !== upload) return; // superseded during the async IDB lookup
        if (prev.length > 0) {
          resumeBanner.classList.add('visible');
          setTimeout(function() { resumeBanner.classList.remove('visible'); }, 5000);
          upload.resumeUpload(prev[0]);
        } else {
          upload.start();
        }
        resetStallTimer(entry); // armed after resume/start, not before the IDB lookup
      });
    }
  }

  function retryUpload(entry) {
    entry.status = 'checking';
    entry.stallCount = 0;
    entry.progress = 0;
    entry.bytesUploaded = 0;
    entry.error = null;
    entry.tusId = null;
    entry.fresh = true; // explicit retry starts clean (no stale fingerprint resume)
    var old = entry.tusUpload;
    entry.tusUpload = null;              // supersede: old instance's callbacks now ignored
    clearStallTimer(entry);
    if (old) { try { old.abort(); } catch (e) {} }
    // Re-probe on retry: the usual reason to retry is that the user just downloaded
    // the file out of Google Photos, so re-check rather than going straight back to
    // tus and stalling for another ~3 minutes. verifyReadable() pumps the queue.
    updateFileCard(entry);
    verifyReadable(entry);
  }

  // ─── Progress tracking ────────────────────────────────────────────
  function updateOverallProgress() {
    var completed = 0;
    var currentUploaded = 0;
    files.forEach(function(f) {
      if (f.status === 'complete') completed++;
      currentUploaded += (f.bytesUploaded || 0);
    });

    progressText.textContent = completed + ' of ' + files.length + ' files \u2014 ' +
      formatBytes(currentUploaded) + ' / ' + formatBytes(totalBytes);

    var pct = totalBytes > 0 ? (currentUploaded / totalBytes) * 100 : 0;
    overallFill.style.width = Math.round(pct) + '%';

    var now = Date.now();
    if (lastSpeedTime && now - lastSpeedTime >= 2000) {
      var elapsed = (now - lastSpeedTime) / 1000;
      var delta = currentUploaded - lastSpeedBytes;
      if (delta > 0) {
        var speed = delta / elapsed;
        speedSamples.push(speed);
        if (speedSamples.length > 5) speedSamples.shift();
        var avg = speedSamples.reduce(function(a, b) { return a + b; }, 0) / speedSamples.length;
        var remaining = totalBytes - currentUploaded;
        var eta = avg > 0 ? remaining / avg : 0;
        etaText.textContent = formatBytes(avg) + '/s \u2014 ' + formatTime(eta) + ' left';
        wakeDetail.textContent = formatTime(eta) + ' remaining \u2014 keep this page open';
      }
      lastSpeedTime = now;
      lastSpeedBytes = currentUploaded;
    }
    if (!lastSpeedTime) { lastSpeedTime = now; lastSpeedBytes = currentUploaded; }
  }

  // ─── Completion ───────────────────────────────────────────────────
  function checkAllComplete() {
    if (files.length === 0) return;
    var allDone = files.every(function(f) { return f.status === 'complete' || f.status === 'error'; });
    if (allDone && completedUploadIds.length > 0) {
      finishSection.classList.add('visible');
      releaseWakeLock();
    }
  }

  // ─── Finish & Save ────────────────────────────────────────────────
  finishBtn.addEventListener('click', function() {
    if (completedUploadIds.length === 0) return;
    finishBtn.disabled = true;
    finishStatus.textContent = 'Saving to tracker...';

    fetch('/upload/complete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, uploadIds: completedUploadIds }),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.ok && (!data.errors || data.errors.length === 0)) {
        // All files succeeded — clean finish
        uploadEl.style.display = 'none';
        doneSection.classList.add('visible');
      } else if (data.ok && data.errors && data.errors.length > 0) {
        // Partial success — some files failed
        var msg = data.fileCount + ' file' + (data.fileCount !== 1 ? 's' : '') + ' saved, but ' +
          data.errors.length + ' failed:\n';
        data.errors.forEach(function(e) { msg += '\n\u2022 ' + e; });
        finishStatus.textContent = msg;
        finishStatus.style.color = 'var(--warning)';
        finishStatus.style.whiteSpace = 'pre-wrap';
        finishStatus.style.textAlign = 'left';
        finishBtn.textContent = 'Close';
        finishBtn.disabled = false;
        finishBtn.onclick = function() {
          uploadEl.style.display = 'none';
          doneSection.querySelector('h2').textContent = 'Partially Complete';
          doneSection.querySelector('h2').style.color = 'var(--warning)';
          doneSection.querySelector('p').textContent = data.fileCount + ' files saved. ' + data.errors.length + ' failed — re-upload those files.';
          doneSection.classList.add('visible');
        };
      } else {
        // Total failure
        var errMsg = data.error || 'Unknown error';
        if (data.details && data.details.length > 0) {
          errMsg += ':\n';
          data.details.forEach(function(d) { errMsg += '\n\u2022 ' + d; });
        }
        finishStatus.textContent = errMsg;
        finishStatus.style.color = 'var(--error)';
        finishStatus.style.whiteSpace = 'pre-wrap';
        finishStatus.style.textAlign = 'left';
        finishBtn.disabled = false;
      }
    })
    .catch(function() {
      finishStatus.textContent = 'Network error. Please try again.';
      finishBtn.disabled = false;
    });
  });

})();
</script>
</body>
</html>
